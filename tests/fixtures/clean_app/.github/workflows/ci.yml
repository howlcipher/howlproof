name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Greet the contributor
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "Thanks $TITLE"
